<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Community Blog — Submit & Live Feed</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="blog.css">
</head>
<body>

  <!-- Back to Home Navbar -->
<nav class="navbar navbar-dark custom-navbar">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">← Back to Home</a>
  </div>
</nav>

  <main class="container-fluid page-grid">
    <div class="row gx-4">

      <!-- LEFT: Form -->
      <aside class="col-12 col-lg-4 left-panel">
        <div class="card form-card p-3">
          <h4 class="mb-3">Write a Blog</h4>

          <div class="mb-2">
            <label for="authorName" class="form-label small">Your Name</label>
            <input id="authorName" class="form-control" placeholder="Your name" />
          </div>

          <div class="mb-2">
            <label for="blogTitle" class="form-label small">Title</label>
            <input id="blogTitle" class="form-control" placeholder="Blog title" />
          </div>

          <div class="mb-2">
            <label for="blogContent" class="form-label small">Content</label>
            <textarea id="blogContent" class="form-control" rows="8" placeholder="Write your post..." ></textarea>
          </div>

          <div class="d-flex gap-2 mt-2">
            <button id="postBtn" class="btn btn-primary flex-grow-1">Post Blog</button>
            <button id="clearBtn" class="btn btn-outline-secondary">Clear</button>
          </div>

          <div id="formMsg" class="mt-3 small"></div>
          <div class="mt-4 small text-muted">Your post will appear immediately on the right after submission.</div>
        </div>
      </aside>

      <!-- RIGHT: Live feed -->
      <section class="col-12 col-lg-8 right-panel">
        <div class="feed-header d-flex align-items-center justify-content-between mb-3">
          <h4 class="mb-0">Latest Posts</h4>
          <div class="small text-muted" id="postCount">0 posts</div>
        </div>

        <div id="feed" class="feed-list">
          <!-- posts injected here -->
        </div>
      </section>

    </div>
  </main>

  <!-- Firebase + app logic -->
  <script type="module">
    // load shared navbar if present
    fetch('navbar.html').then(r => r.text()).then(t => { const el = document.getElementById('navbar-placeholder'); if(el) el.innerHTML = t; }).catch(()=>{});

    // === FIREBASE SDK imports (v11 modular) ===
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getFirestore, collection, addDoc, serverTimestamp,
      query, orderBy, onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // TODO: REPLACE with your firebaseConfig from console
    const firebaseConfig = {
  apiKey: "AIzaSyBTHu6Kf7wwyqz9oqWSxIpyo1tnVVimfzg",
  authDomain: "sauravblog-516e9.firebaseapp.com",
  projectId: "sauravblog-516e9",
  storageBucket: "sauravblog-516e9.firebasestorage.app",
  messagingSenderId: "339270924739",
  appId: "1:339270924739:web:6985cfe6c447bf3e776576",
  measurementId: "G-RXL8E2XRDD"
};


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const blogsCol = collection(db, "blogs");

    // UI elements
    const postBtn = document.getElementById('postBtn');
    const clearBtn = document.getElementById('clearBtn');
    const feedEl = document.getElementById('feed');
    const postCountEl = document.getElementById('postCount');
    const formMsg = document.getElementById('formMsg');

    function sanitize(text) {
      // basic sanitize to prevent raw HTML injection in UI (not a replacement for server-side sanitization)
      return text.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    }

    async function submitPost() {
      const name = (document.getElementById('authorName').value || '').trim();
      const title = (document.getElementById('blogTitle').value || '').trim();
      const content = (document.getElementById('blogContent').value || '').trim();

      if (!name || !title || !content) {
        formMsg.innerHTML = '<span class="text-danger">Please fill all fields.</span>';
        return;
      }
      formMsg.innerHTML = '<span class="text-info">Posting…</span>';
      try {
        await addDoc(blogsCol, {
          name, title, content,
          timestamp: serverTimestamp()
        });
        formMsg.innerHTML = '<span class="text-success">Posted successfully!</span>';
        document.getElementById('authorName').value = '';
        document.getElementById('blogTitle').value = '';
        document.getElementById('blogContent').value = '';
        setTimeout(()=> formMsg.innerHTML = '', 2500);
      } catch (err) {
        console.error('post error', err);
        formMsg.innerHTML = '<span class="text-danger">Could not post. Check console.</span>';
      }
    }

    clearBtn.addEventListener('click', () => {
      document.getElementById('authorName').value = '';
      document.getElementById('blogTitle').value = '';
      document.getElementById('blogContent').value = '';
      formMsg.innerHTML = '';
    });

    postBtn.addEventListener('click', submitPost);

    // REAL-TIME feed: order by timestamp desc
    const q = query(blogsCol, orderBy('timestamp', 'desc'));
    onSnapshot(q, (snapshot) => {
      feedEl.innerHTML = '';
      let count = 0;
      snapshot.forEach(doc => {
        count++;
        const d = doc.data();
        const date = d.timestamp && d.timestamp.toDate ? d.timestamp.toDate().toLocaleString() : '';
        const postHTML = `
          <article class="post-card">
            <div class="post-meta">
              <strong class="post-title">${sanitize(d.title)}</strong>
              <div class="post-by small text-muted">By ${sanitize(d.name)} • ${sanitize(date)}</div>
            </div>
            <p class="post-content">${sanitize(d.content).replaceAll('\\n','<br>')}</p>
          </article>
        `;
        const wrapper = document.createElement('div');
        wrapper.className = 'mb-3';
        wrapper.innerHTML = postHTML;
        feedEl.appendChild(wrapper);
      });
      postCountEl.textContent = `${count} post${count===1?'':'s'}`;
      if (count === 0) {
        feedEl.innerHTML = '<div class="text-center text-muted py-5">No posts yet — be the first to share!</div>';
      }
    }, (err) => {
      console.error('snapshot error', err);
      feedEl.innerHTML = '<div class="text-danger">Error loading posts.</div>';
    });

  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
