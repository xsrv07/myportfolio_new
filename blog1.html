<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blogs - Saurav Gupta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="blog.css">
</head>
<body>
  <nav class="navbar navbar-dark custom-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">← Back to Home</a>
    </div>
  </nav>

  <section class="blog-page py-5 mt-0">
    <div class="container">
      <h1 class="fw-bold text-gradient text-center mb-5">My Blog Posts</h1>
      <div id="allBlogs" class="row g-4 justify-content-center">
        <!-- Blog posts appear here -->
      </div>
    </div>
  </section>

  <script>
    // Reuse same array for blogs
    const blogPosts = [
      {
        id: "consumer behavior",
        title: "Why Cognitive Bias is Dangerous",
        date: "October 25, 2025",
        content: `
         <p>Human decision-making is rarely as rational as we’d like to believe. Cognitive biases—systematic patterns of deviation from logical judgment—shape our thoughts, choices, and behaviors in subtle yet powerful ways. While these mental shortcuts help us process information quickly, they often lead to flawed reasoning and poor decisions.</p>

<p><strong>The Hidden Trap</strong></p>
<p>Biases like <em>confirmation bias</em> make us seek information that supports our existing beliefs, ignoring contradictory evidence. <em>Anchoring bias</em> causes us to rely too heavily on the first piece of information we encounter, even when it’s irrelevant. These tendencies distort reality, creating blind spots that can affect everything from personal relationships to business strategies.</p>

<p><strong>Real-World Consequences</strong></p>
<p>In healthcare, cognitive bias can lead to misdiagnosis. In finance, it fuels risky investments based on herd mentality. In everyday life, it perpetuates stereotypes and poor judgment. The danger lies in the fact that these biases operate unconsciously, making them hard to detect and correct.</p>

<p><strong>How to Fight Back</strong></p>
<p>Awareness is the first step. Actively questioning assumptions, seeking diverse perspectives, and using data-driven approaches can help mitigate bias. Tools like checklists and structured decision-making frameworks are practical ways to reduce its impact.</p>

<p><strong>Bottom line:</strong> Cognitive bias isn’t just a psychological curiosity—it’s a silent influencer that can derail critical thinking and lead to costly mistakes. Recognizing and addressing it is essential for better decisions and a more objective worldview.</p>
        `
      },
      {
        id: "life-protocols",
        title: "दुःखालयम् अशाश्वतम्: The Impermanence of Material Life",
        date: "October 23, 2025",
        content: `
          



<p>The phrase <em>“दुःखालयम् अशाश्वतम्”</em> from the <strong>Bhagavad Gita</strong> (Chapter 8, Verse 15) translates to “a place of misery, temporary.” It is a profound reminder about the nature of the material world. Life here is not meant to be perfect or permanent; it is inherently filled with challenges, uncertainties, and suffering.</p>

<p><strong>Understanding the Message</strong></p>
<p>We often chase happiness through possessions, status, and relationships, believing these will bring lasting joy. However, the Gita teaches that material existence is fleeting. Everything we hold dear—our body, wealth, and even loved ones—is subject to change and decay. This impermanence is the root of anxiety and disappointment.</p>

<p><strong>Why It Matters</strong></p>
<p>Recognizing the world as <em>“दुःखालयम् अशाश्वतम्”</em> does not mean rejecting life; rather, it encourages us to shift our focus from temporary pleasures to eternal truths. It invites us to cultivate inner peace, spiritual wisdom, and detachment, so we can navigate life’s ups and downs without losing balance.</p>

<p><strong>The Takeaway</strong></p>
<p>True happiness lies beyond the material realm. By understanding that this world is a temporary abode of suffering, we can redirect our energy toward spiritual growth and lasting fulfillment. This insight transforms how we live—less clinging, more meaning.</p>
        `
      }
    ];

    const blogContainer = document.getElementById("allBlogs");
    blogContainer.innerHTML = blogPosts
      .map(
        (post) => `
        <div class="col-12 col-md-10 col-lg-8">
          <div class="blog-full-card" id="${post.id}">
            <h3 class="fw-bold">${post.title}</h3>
            <small class="text-muted mb-2 d-block">${post.date}</small>
            <div class="blog-content text-muted">${post.content}</div>
          </div>
        </div>`
      )
      .join("");
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
