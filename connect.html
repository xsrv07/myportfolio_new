<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect with Me - Saurav Gupta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="connect.css">
</head>
<body>
<nav class="navbar navbar-dark custom-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">← Back to Home</a>
    </div>
</nav>

<section class="contact-section text-center">
    <div class="container">
        <h1 class="display-5 fw-bold mb-4">Connect with Me</h1>
        <p class="lead mb-5">I'd love to hear from you. Let's connect and explore the next chapter together.</p>

        <div class="mb-4">
            <p class="fs-5">
                <i class="bi bi-telephone-fill me-2"></i>& <i class="bi bi-whatsapp"></i>
                : +91 8051131068
            </p>
            <p class="fs-5">
                <i class="bi bi-envelope-fill me-2"></i>: xsaurav.time@gmail.com
            </p>
        </div>

        <form id="contactForm" class="contact-form mx-auto" style="max-width:500px;">
            <div class="mb-3">
                <input type="text" id="name" name="name" class="form-control" placeholder="Your Name" required>
                <div class="invalid-feedback">Please enter your name.</div>
            </div>
            <div class="mb-3">
                <input type="email" id="email" name="email" class="form-control" placeholder="Your Email" required>
                <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>
            <div class="mb-3">
                <textarea id="message" name="message" class="form-control" rows="4" placeholder="Your Message"
                          required></textarea>
                <div class="invalid-feedback">Please enter your message.</div>
            </div>
            <button type="submit" class="btn btn-primary px-4" id="submitBtn">Send Message</button>
            <div id="statusMessage" class="mt-3"></div>
        </form>
    </div>
</section>

<!-- Firestore scripts to save the forms-->
<script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // TODO: Replace with your Firebase configuration
    // Get this from Firebase Console > Project Settings > General > Your apps
    const firebaseConfig = {
  apiKey: "AIzaSyBTHu6Kf7wwyqz9oqWSxIpyo1tnVVimfzg",
  authDomain: "sauravblog-516e9.firebaseapp.com",
  projectId: "sauravblog-516e9",
  storageBucket: "sauravblog-516e9.firebasestorage.app",
  messagingSenderId: "339270924739",
  appId: "1:339270924739:web:6985cfe6c447bf3e776576",
  measurementId: "G-RXL8E2XRDD"
};

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Form validation and submission
    const form = document.getElementById("contactForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMessage = document.getElementById("statusMessage");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      // Clear previous validation states
      form.classList.remove('was-validated');
      statusMessage.innerHTML = '';

      // Validate fields
      let isValid = true;

      if (!name) {
        document.getElementById("name").classList.add('is-invalid');
        isValid = false;
      } else {
        document.getElementById("name").classList.remove('is-invalid');
        document.getElementById("name").classList.add('is-valid');
      }

      if (!email || !emailPattern.test(email)) {
        document.getElementById("email").classList.add('is-invalid');
        isValid = false;
      } else {
        document.getElementById("email").classList.remove('is-invalid');
        document.getElementById("email").classList.add('is-valid');
      }

      if (!message) {
        document.getElementById("message").classList.add('is-invalid');
        isValid = false;
      } else {
        document.getElementById("message").classList.remove('is-invalid');
        document.getElementById("message").classList.add('is-valid');
      }

      if (!isValid) {
        statusMessage.innerHTML = '<div class="alert alert-danger">Please fill out all fields correctly.</div>';
        return;
      }

      // Disable submit button
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';

      try {
        // Add document to Firestore
        await addDoc(collection(db, "ContactMe"), {
          name: name,
          email: email,
          message: message,
          timestamp: serverTimestamp()
        });

        // Success message
        statusMessage.innerHTML = '<div class="alert alert-success">Message sent successfully! I\'ll get back to you soon.</div>';
        form.reset();

        // Remove validation classes
        document.getElementById("name").classList.remove('is-valid');
        document.getElementById("email").classList.remove('is-valid');
        document.getElementById("message").classList.remove('is-valid');

      } catch (error) {
        console.error("Error adding document: ", error);
        statusMessage.innerHTML = '<div class="alert alert-danger">Failed to send message. Please try again or contact directly via email.</div>';
      } finally {
        // Re-enable submit button
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Send Message';
      }
    });
</script>
</body>
</html>
